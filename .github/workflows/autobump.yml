name: Autobump packages

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

concurrency:
  group: autobump-packages
  cancel-in-progress: false

jobs:
  autobump:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Tap repository
        run: brew tap NakaokaRei/tap

      - name: Check for new releases and open pull requests
        uses: Homebrew/actions/bump-packages@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Qualified names enable --full-name, which makes PR searches miss
          # existing bump PRs titled with the short package name.
          formulae: >
            sagui
            swift-mcp-gui
          casks: >
            trackpad-air
          fork: false
